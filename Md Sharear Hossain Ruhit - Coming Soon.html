<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Md Sharear Hossain Ruhit — Product &amp; Services</title>

  <!-- Google Fonts: Inter for crisp English & tabular numbers, Hind Siliguri for clean Bangla typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Tailwind Custom Configuration for Fonts & Ambient Orb Animations -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            bangla: ['"Hind Siliguri"', 'sans-serif'],
          },
          keyframes: {
            floatSlow: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(24px, -28px) scale(1.08)' },
            },
            floatReverse: {
              '0%, 100%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(-26px, 24px) scale(1.06)' },
            },
          },
          animation: {
            'float-slow': 'floatSlow 10s ease-in-out infinite',
            'float-reverse': 'floatReverse 12s ease-in-out infinite',
          },
        },
      },
    };
  </script>
</head>
<body class="relative min-h-screen w-full overflow-x-hidden bg-slate-950 font-sans text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 flex items-center justify-center p-4 sm:p-6">

  <!-- Subtle Background Grid Pattern -->
  <div
    aria-hidden="true"
    class="pointer-events-none fixed inset-0 bg-[linear-gradient(to_right,rgba(255,255,255,0.035)_1px,transparent_1px),linear-gradient(to_bottom,rgba(255,255,255,0.035)_1px,transparent_1px)] bg-[size:36px_36px] [mask-image:radial-gradient(ellipse_75%_65%_at_50%_50%,#000_65%,transparent_100%)]"
  ></div>

  <!-- Ambient Animated Glowing Orbs (Cyan & Indigo) -->
  <div
    aria-hidden="true"
    class="pointer-events-none fixed -top-24 -left-20 h-72 w-72 sm:h-96 sm:w-96 rounded-full bg-cyan-500/25 blur-3xl animate-float-slow"
  ></div>
  <div
    aria-hidden="true"
    class="pointer-events-none fixed -bottom-24 -right-20 h-80 w-80 sm:h-[26rem] sm:w-[26rem] rounded-full bg-indigo-600/30 blur-3xl animate-float-reverse"
  ></div>
  <div
    aria-hidden="true"
    class="pointer-events-none fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 h-64 w-64 sm:h-80 sm:w-80 rounded-full bg-sky-500/10 blur-3xl"
  ></div>

  <!-- Main Content Container -->
  <main class="relative z-10 w-full max-w-2xl mx-auto">
    <!-- Frosted Glassmorphism Card -->
    <section
      aria-label="Coming Soon Announcement"
      class="relative overflow-hidden rounded-3xl border border-white/10 bg-white/[0.04] backdrop-blur-2xl px-5 py-9 sm:px-10 sm:py-12 shadow-[0_24px_80px_-12px_rgba(0,0,0,0.85)] ring-1 ring-inset ring-white/10 text-center"
    >
      <!-- Subtle Top Accent Glow Line -->
      <div
        aria-hidden="true"
        class="pointer-events-none absolute inset-x-12 top-0 h-px bg-gradient-to-r from-transparent via-cyan-400/60 to-transparent"
      ></div>

      <!-- Header Group: Main Title & Subtitle Pill -->
      <header class="flex flex-col items-center">
        <!-- Main Title in Bold Gradient Typography -->
        <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold tracking-tight leading-tight bg-gradient-to-r from-white via-cyan-100 to-indigo-300 bg-clip-text text-transparent">
          Md Sharear Hossain Ruhit
        </h1>

        <!-- Subtitle Pill Badge -->
        <div class="mt-3.5 sm:mt-4 inline-flex items-center gap-2 rounded-full border border-cyan-400/25 bg-cyan-500/10 px-4 py-1.5 shadow-sm">
          <span class="h-1.5 w-1.5 rounded-full bg-cyan-400"></span>
          <span class="text-xs sm:text-sm font-semibold uppercase tracking-[0.2em] text-cyan-300">
            Product &amp; Services
          </span>
        </div>
      </header>

      <!-- Divider -->
      <div
        aria-hidden="true"
        class="my-7 sm:my-9 h-px w-full bg-gradient-to-r from-transparent via-white/10 to-transparent"
      ></div>

      <!-- Live 4-Box Countdown Timer (Single Horizontal Row on All Devices) -->
      <div aria-label="Launch Countdown Timer" class="w-full">
        <div class="grid grid-cols-4 gap-2 sm:gap-4 w-full">
          <!-- Days Box -->
          <div class="group relative flex flex-col items-center justify-center rounded-2xl border border-white/10 bg-slate-900/65 backdrop-blur-md py-3.5 px-1 sm:py-5 sm:px-3 shadow-inner transition-colors duration-300 hover:border-cyan-400/35">
            <span
              id="cd-days"
              class="text-2xl sm:text-4xl md:text-5xl font-bold text-white tabular-nums tracking-tight leading-none"
            >
              10
            </span>
            <span class="mt-1.5 sm:mt-2 text-[10px] sm:text-xs font-medium uppercase tracking-wider text-slate-400 group-hover:text-cyan-300 transition-colors">
              Days
            </span>
          </div>

          <!-- Hours Box -->
          <div class="group relative flex flex-col items-center justify-center rounded-2xl border border-white/10 bg-slate-900/65 backdrop-blur-md py-3.5 px-1 sm:py-5 sm:px-3 shadow-inner transition-colors duration-300 hover:border-cyan-400/35">
            <span
              id="cd-hours"
              class="text-2xl sm:text-4xl md:text-5xl font-bold text-white tabular-nums tracking-tight leading-none"
            >
              00
            </span>
            <span class="mt-1.5 sm:mt-2 text-[10px] sm:text-xs font-medium uppercase tracking-wider text-slate-400 group-hover:text-cyan-300 transition-colors">
              Hours
            </span>
          </div>

          <!-- Minutes Box -->
          <div class="group relative flex flex-col items-center justify-center rounded-2xl border border-white/10 bg-slate-900/65 backdrop-blur-md py-3.5 px-1 sm:py-5 sm:px-3 shadow-inner transition-colors duration-300 hover:border-cyan-400/35">
            <span
              id="cd-minutes"
              class="text-2xl sm:text-4xl md:text-5xl font-bold text-white tabular-nums tracking-tight leading-none"
            >
              00
            </span>
            <span class="mt-1.5 sm:mt-2 text-[10px] sm:text-xs font-medium uppercase tracking-wider text-slate-400 group-hover:text-cyan-300 transition-colors">
              Minutes
            </span>
          </div>

          <!-- Seconds Box -->
          <div class="group relative flex flex-col items-center justify-center rounded-2xl border border-white/10 bg-slate-900/65 backdrop-blur-md py-3.5 px-1 sm:py-5 sm:px-3 shadow-inner transition-colors duration-300 hover:border-indigo-400/40">
            <span
              id="cd-seconds"
              class="text-2xl sm:text-4xl md:text-5xl font-bold bg-gradient-to-b from-cyan-200 to-indigo-300 bg-clip-text text-transparent tabular-nums tracking-tight leading-none"
            >
              00
            </span>
            <span class="mt-1.5 sm:mt-2 text-[10px] sm:text-xs font-medium uppercase tracking-wider text-slate-400 group-hover:text-indigo-300 transition-colors">
              Seconds
            </span>
          </div>
        </div>
      </div>

      <!-- Status Pill with Pulsing Emerald Dot & Bangla Message -->
      <div class="mt-8 sm:mt-10 flex justify-center">
        <div class="inline-flex items-center justify-center gap-2.5 rounded-full border border-emerald-400/25 bg-emerald-500/10 px-4 py-2.5 sm:px-6 sm:py-3 shadow-sm">
          <!-- Pulsing Emerald Indicator -->
          <span class="relative flex h-2.5 w-2.5 shrink-0">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex h-2.5 w-2.5 rounded-full bg-emerald-500"></span>
          </span>

          <!-- Exact Bangla Status Text -->
          <p class="font-bangla text-sm sm:text-base md:text-lg font-medium text-emerald-200 leading-snug">
            এইটার কাজ চলছে খুব শিগগিরই চলে আসবে
          </p>
        </div>
      </div>
    </section>

    <!-- Minimal Footer Note -->
    <footer class="mt-5 text-center">
      <p class="text-xs text-slate-500">
        &copy; 2026 Md Sharear Hossain Ruhit
      </p>
    </footer>
  </main>

  <!-- Live Countdown Timer Script -->
  <script>
    (function () {
      // Target Launch Date: December 1, 2026 at 12:00 PM (+06:00 Bangladesh Standard Time)
      const TARGET_TIMESTAMP = new Date('2026-12-01T12:00:00+06:00').getTime();

      const daysEl = document.getElementById('cd-days');
      const hoursEl = document.getElementById('cd-hours');
      const minutesEl = document.getElementById('cd-minutes');
      const secondsEl = document.getElementById('cd-seconds');

      /**
       * Formats a number to always have at least 2 digits (e.g., 7 -> "07")
       */
      function padZero(value) {
        return String(Math.max(0, Math.floor(value))).padStart(2, '0');
      }

      /**
       * Calculates remaining time and updates the DOM cleanly
       */
      function updateCountdown() {
        try {
          const now = Date.now();
          const remaining = TARGET_TIMESTAMP - now;

          if (remaining <= 0) {
            daysEl.textContent = '00';
            hoursEl.textContent = '00';
            minutesEl.textContent = '00';
            secondsEl.textContent = '00';
            return;
          }

          const secondMs = 1000;
          const minuteMs = secondMs * 60;
          const hourMs = minuteMs * 60;
          const dayMs = hourMs * 24;

          const days = Math.floor(remaining / dayMs);
          const hours = Math.floor((remaining % dayMs) / hourMs);
          const minutes = Math.floor((remaining % hourMs) / minuteMs);
          const seconds = Math.floor((remaining % minuteMs) / secondMs);

          daysEl.textContent = padZero(days);
          hoursEl.textContent = padZero(hours);
          minutesEl.textContent = padZero(minutes);
          secondsEl.textContent = padZero(seconds);
        } catch (error) {
          console.error('Countdown update error:', error);
        }
      }

      // Run immediately on load so there is zero delay before displaying accurate numbers
      updateCountdown();

      // Update every second
      setInterval(updateCountdown, 1000);
    })();
  </script>
</body>
</html>
